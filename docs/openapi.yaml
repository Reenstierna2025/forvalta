components:
  schemas:
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 180
        kind:
          $ref: '#/components/schemas/AssetKindEnum'
        address:
          type: string
          maxLength: 240
        designation:
          type: string
          maxLength: 100
        area:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        owner:
          type: string
          maxLength: 180
        manager:
          type: string
          maxLength: 180
        description:
          type: string
        public:
          type: boolean
        org:
          type: string
          format: uuid
        parent:
          type: string
          format: uuid
          nullable: true
      required:
      - created_at
      - id
      - kind
      - name
      - org
      - updated_at
      - version
    AssetKindEnum:
      enum:
      - property
      - building
      - land
      - premises
      - room
      - object
      type: string
      description: |-
        * `property` - property
        * `building` - building
        * `land` - land
        * `premises` - premises
        * `room` - room
        * `object` - object
    BudgetScenario:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 180
        start_year:
          type: integer
          maximum: 2200
          minimum: 1900
        years:
          type: integer
          maximum: 30
          minimum: 1
        state:
          allOf:
          - $ref: '#/components/schemas/BudgetScenarioStateEnum'
          readOnly: true
        lines:
          readOnly: true
        org_snapshot:
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        org:
          type: string
          format: uuid
      required:
      - created_at
      - id
      - lines
      - name
      - org
      - org_snapshot
      - published_at
      - start_year
      - state
      - updated_at
      - version
    BudgetScenarioStateEnum:
      enum:
      - draft
      - published
      type: string
      description: |-
        * `draft` - Utkast
        * `published` - Fastställd
    ConditionEnum:
      enum:
      - ok
      - lost
      - broken
      type: string
      description: |-
        * `ok` - Hel
        * `lost` - Borttappad
        * `broken` - Trasig
    CostEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        kind:
          $ref: '#/components/schemas/CostEntryKindEnum'
        description:
          type: string
          maxLength: 200
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
        org:
          type: string
          format: uuid
        work:
          type: string
          format: uuid
      required:
      - created_at
      - date
      - description
      - id
      - kind
      - org
      - quantity
      - unit_price
      - updated_at
      - version
      - work
    CostEntryKindEnum:
      enum:
      - time
      - material
      - expense
      type: string
      description: |-
        * `time` - time
        * `material` - material
        * `expense` - expense
    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 180
        file_key:
          type: string
          maxLength: 300
        sha256:
          type: string
          maxLength: 64
        size:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        mime:
          type: string
          maxLength: 100
        shared_contractor:
          type: boolean
        org:
          type: string
          format: uuid
        asset:
          type: string
          format: uuid
        work:
          type: string
          format: uuid
          nullable: true
