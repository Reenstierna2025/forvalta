name: Container builds
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [api, db, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --build-arg CADDY_CONFIG=deploy/Caddyfile.coolify -f deploy/Dockerfile.${{ matrix.component }} -t forvalta-${{ matrix.component }}:test .
      - name: Validate proxy configuration
        if: matrix.component == 'web'
        run: docker run --rm forvalta-web:test caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
