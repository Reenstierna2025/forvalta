name: Test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: forvalta
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: forvalta
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U forvalta" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: '1'
      MFA_REQUIRED: '0'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: forvalta
      POSTGRES_DB: forvalta
      POSTGRES_PASSWORD: synthetic-ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py test core
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
